<script>
// Heuristic AI with a 2-ply search (own full turn + opponent's best reply).
// It never peeks at hidden information: unknown reserved cards are ignored,
// simulated deck refills are hidden, and simulated shuffles use a decoupled RNG.

(function () {
  const E = typeof module !== 'undefined' ? require('./engine.js') : window.Engine;
  const GEMS = E.GEMS;

  // ---------- evaluation ----------
  function playerScore(state, idx, viewerIdx) {
    const p = state.players[idx];
    const pts = E.points(p);
    const cr = E.crowns(p);
    const cp = E.colorPoints(p);
    const b = E.bonuses(p);
    let score = 0;

    score += pts * 100;
    score += Math.min(cr, 10) * 55;
    // closing in on thresholds is superlinear
    if (pts >= 15) score += (pts - 14) * 40;
    if (cr >= 7) score += (cr - 6) * 45;
    const bestColor = Math.max(...GEMS.map((c) => cp[c]));
    score += bestColor * 28;
    if (bestColor >= 7) score += (bestColor - 6) * 45;

    // economy: bonuses make future cards cheaper (diminishing returns)
    let btotal = 0;
    for (const c of GEMS) btotal += Math.min(b[c], 4);
    score += btotal * 26;

    // tokens: purchasing power, mild (they get spent)
    score += (p.tokens.white + p.tokens.blue + p.tokens.green + p.tokens.red + p.tokens.black) * 7;
    score += p.tokens.pearl * 11;
    score += p.tokens.gold * 13;

    score += p.privileges * 9;

    // reserved cards are latent value; hidden opponent reserves are unknown
    for (const rc of p.reserved) {
      const card = E.CARD_BY_ID[rc.id];
      if (rc.known || idx === viewerIdx) score += card.points * 6 + card.crowns * 5 + 4;
      else score += 4;
    }
    return score;
  }

  function evaluate(state, myIdx) {
    if (state.winner === myIdx) return 1e9 - state.turnCount * 1000; // prefer faster wins
    if (state.winner === 1 - myIdx) return -1e9 + state.turnCount * 1000;
    return playerScore(state, myIdx, myIdx) - playerScore(state, 1 - myIdx, myIdx) * 1.05;
  }

  // ---------- decision policy for pending choices ----------
  // Applies pending decisions (joker color, steal, royal, discard, board token)
  // greedily by 0-ply evaluation.
  function resolvePendings(state, myIdx) {
    let guard = 0;
    while (state.winner === null && state.pending.length > 0 && guard++ < 40) {
      const moves = E.legalMoves(state);
      if (moves.length === 0) break;
      let best = null, bestScore = -Infinity;
      const perspective = state.current; // decisions are made by the player to move
      for (const mv of moves) {
        const s2 = E.applyMove(state, mv);
        const sc = evaluate(s2, perspective);
        if (sc > bestScore) { bestScore = sc; best = s2; }
      }
      state = best;
    }
    return state;
  }

  // decouple simulation randomness from the real game RNG so the AI cannot
  // "foresee" real shuffle outcomes
  function searchClone(state) {
    const s = E.clone(state);
    s.rng = (s.rng * 31 + 17) | 0;
    return s;
  }

  // hide information the AI should not see: replace unknown opponent reserved
  // cards and deck contents with placeholders (decks keep only their sizes).
  function sanitize(state, myIdx) {
    const s = E.clone(state);
    // NOTE: deck order stays but AI never inspects it directly; reshuffling here
    // with a derived rng prevents indirect peeking via simulated draws.
    for (const lv of [1, 2, 3]) E.shuffle(s, s.decks[lv]);
    return s;
  }

  function applyFullMove(state, mv, actorIdx) {
    // apply a move then greedily resolve any pending decisions of that actor
    let s = E.applyMove(state, mv);
    s = resolvePendings(s, actorIdx);
    return s;
  }

  // enumerate turn plans: single moves, plus privilege-enabled buys
  function candidatePlans(state) {
    const me = state.players[state.current];
    const moves = E.legalMoves(state);
    const plans = moves.filter((m) => m.t !== 'privilege').map((m) => [m]);

    // privilege combos: spend 1..n privileges to grab tokens enabling a buy,
    // or simply grab the most contested token then act
    if (me.privileges > 0 && state.pending.length === 0 && !state.turn.mandatoryDone) {
      const tokensOnBoard = {};
      state.board.forEach((tok, i) => {
        if (tok && tok !== 'gold') (tokensOnBoard[tok] = tokensOnBoard[tok] || []).push(i);
      });
      // try: privilege-take one token of each color, then best of (take/buy) as single follow-up
      for (const color of Object.keys(tokensOnBoard)) {
        plans.push([{ t: 'privilege', cell: tokensOnBoard[color][0] }, '*mandatory*']);
      }
    }
    return plans;
  }

  function expandPlan(state, plan, actorIdx) {
    // returns resulting state or null if illegal
    let s = state;
    for (const step of plan) {
      if (step === '*mandatory*') {
        // choose best mandatory follow-up greedily
        const moves = E.legalMoves(s).filter((m) => ['take', 'reserve', 'buy', 'replenish', 'pass'].includes(m.t));
        if (moves.length === 0) return null;
        let best = null, bestScore = -Infinity;
        for (const mv of moves) {
          const s2 = applyFullMove(s, mv, actorIdx);
          const sc = evaluate(s2, actorIdx);
          if (sc > bestScore) { bestScore = sc; best = s2; }
        }
        s = best;
      } else {
        try {
          s = applyFullMove(s, step, actorIdx);
        } catch (e) {
          return null;
        }
      }
    }
    return s;
  }

  // best reply score for player `idx` (greedy, 1 ply)
  function bestReplyScore(state, idx) {
    if (state.winner !== null) return evaluate(state, idx);
    if (state.current !== idx) return evaluate(state, idx); // extra turn for other player
    const moves = E.legalMoves(state);
    // dedupe cheap variants for speed: takes by token multiset, reserves by target
    const seen = new Set();
    const scored = [];
    for (const mv of moves) {
      let key = null;
      if (mv.t === 'take') key = 'T' + mv.cells.map((i) => state.board[i]).sort().join(',');
      else if (mv.t === 'reserve') key = 'R' + mv.level + ':' + mv.slot;
      if (key) {
        if (seen.has(key)) continue;
        seen.add(key);
      }
      scored.push(mv);
    }
    let best = -Infinity;
    for (const mv of scored) {
      let s2;
      try { s2 = applyFullMove(state, mv, idx); } catch (e) { continue; }
      const sc = evaluate(s2, idx);
      if (sc > best) best = sc;
      if (best >= 1e8) break; // found a win
    }
    return best === -Infinity ? evaluate(state, idx) : best;
  }

  // ---------- main entry ----------
  // Returns the next single move for the current player.
  function chooseMove(state, opts) {
    opts = opts || {};
    const myIdx = state.current;

    // pending decision: resolve greedily by evaluation
    if (state.pending.length > 0) {
      const moves = E.legalMoves(state);
      let best = null, bestScore = -Infinity;
      for (const mv of moves) {
        const s2 = E.applyMove(searchClone(state), mv);
        const sc = evaluate(s2, myIdx);
        if (sc > bestScore) { bestScore = sc; best = mv; }
      }
      return best;
    }

    const base = sanitize(searchClone(state), myIdx);
    const plans = candidatePlans(base);

    // stage 1: static evaluation of each plan outcome
    const evaluated = [];
    for (const plan of plans) {
      const s2 = expandPlan(base, plan, myIdx);
      if (!s2) continue;
      const sc = evaluate(s2, myIdx);
      evaluated.push({ plan, state: s2, score: sc });
    }
    if (evaluated.length === 0) {
      const fallback = E.legalMoves(state);
      return fallback[0] || null;
    }

    // immediate win?
    const winNow = evaluated.find((e) => e.state.winner === myIdx);
    if (winNow) return winNow.plan[0] === '*mandatory*' ? null : winNow.plan[0];

    // stage 2: opponent best reply for the top plans
    evaluated.sort((a, b) => b.score - a.score);
    const beam = evaluated.slice(0, opts.beam || 14);
    for (const e of beam) {
      const oppScore = bestReplyScore(e.state, 1 - myIdx); // opponent's eval
      // our final = our static minus opponent's achievable advantage
      e.final = evaluate(e.state, myIdx) - 0.9 * (oppScore - evaluate(e.state, 1 - myIdx));
    }
    beam.sort((a, b) => b.final - a.final);
    return beam[0].plan[0];
  }

  const AI = { chooseMove, evaluate };
  if (typeof module !== 'undefined') module.exports = AI;
  else window.AI = AI;
})();

</script>
<script>
// UI controller: rendering + interaction. English UI, schematic look.
(function () {
  const E = window.Engine;
  const AI = window.AI;
  const GEMS = E.GEMS;
  const COST_ORDER = ['white', 'blue', 'green', 'red', 'black', 'pearl'];

  let game = null;
  let mode = 'you-first'; // 'you-first' | 'ai-first' | 'hotseat'
  let humanIdx = 0;       // index of the human in vs-AI modes
  let history = [];       // undo snapshots (JSON strings)
  let busy = false;       // AI is playing
  let scoreSaved = false; // result of the current game already sent to the leaderboard
  // transient interaction state
  let sel = [];           // selected board cells for a take
  let privMode = false;
  let cardSel = null;     // {kind:'pyr',level,slot,id} | {kind:'deck',level} | {kind:'res',id}
  let goldFor = null;     // cardSel awaiting a gold cell click

  const $ = (s) => document.querySelector(s);

  const ABILITY_TEXT = {
    again: '↻ extra turn',
    token: '+1 matching token',
    steal: 'steal 1 token',
    privilege: '+1 privilege',
  };
  const ABILITY_TITLE = {
    again: 'Take another turn after this one',
    token: 'Take 1 board token matching this card color',
    steal: 'Take 1 non-gold token from your opponent',
    privilege: 'Take 1 privilege',
  };
  const ABILITY_ICON = { again: '↻', token: '+', steal: '⇄', privilege: '🗞' };

  // ---------- inline infographics for prompts and the move log ----------
  const TOKEN_WORDS = ['white', 'blue', 'green', 'red', 'black', 'pearl', 'gold'];

  function chipsHTML(color, n) {
    if (n <= 4) {
      return `<span class="ichips" title="${n} ${color}">${`<i class="ic c-${color}"></i>`.repeat(n)}</span>`;
    }
    return `<span class="ichips" title="${n} ${color}"><i class="ic c-${color}"></i></span><span class="ixn">×${n}</span>`;
  }

  const SCROLL_HTML = '<span class="iscroll" title="privilege"></span>';

  function cardChipHTML(id) {
    const card = E.CARD_BY_ID[id];
    if (!card) return id;
    const color = card.color === 'joker' ? 'joker' : card.color;
    return `<span class="icard c-${color}" title="${id}: ${card.points} point(s)${card.crowns ? ', ' + '♛'.repeat(card.crowns) : ''}">${card.points || ''}</span>`;
  }

  // Draws tokens, scrolls and cards straight into a sentence: "P1 takes ●●" reads
  // faster than "P1 takes white, black" and looks like the game on the table.
  function infographic(text) {
    // drawings are parked behind control-character markers so later passes cannot
    // match colour names or digits inside the HTML they generate
    const stash = [];
    const put = (html) => '\u0001' + (stash.push(html) - 1) + '\u0002';
    const MARK = '\u0001\\d+\u0002';
    let s = String(text).replace(/[<>&]/g, (ch) => ({ '<': '&lt;', '>': '&gt;', '&': '&amp;' }[ch]));
    s = s.replace(new RegExp(`(\\d+)\\s+(${TOKEN_WORDS.join('|')})\\b`, 'g'), (m, n, c) => put(chipsHTML(c, +n)));
    s = s.replace(new RegExp(`\\b(${TOKEN_WORDS.join('|')})\\b`, 'g'), (m, c) => put(chipsHTML(c, 1)));
    s = s.replace(/\bprivileges?\b/g, () => put(SCROLL_HTML));
    s = s.replace(/\b([123]-\d\d)\b/g, (m, id) => put(cardChipHTML(id)));
    // the words and separators those drawings replace are now noise
    s = s.replace(new RegExp(`(${MARK}(?:[\\s,]+(?:and\\s+)?${MARK})*)\\s+tokens?\\b`, 'g'), '$1');
    s = s.replace(new RegExp(`\\ba (${MARK})`, 'g'), '$1');
    const sepRe = new RegExp(`(${MARK})(?:\\s*,\\s*|\\s+and\\s+)(?=${MARK})`, 'g');
    let prev;
    do { prev = s; s = s.replace(sepRe, '$1'); } while (s !== prev);
    return s.replace(/\u0001(\d+)\u0002/g, (m, i) => stash[+i]);
  }

  function isHuman(idx) { return mode === 'hotseat' || idx === humanIdx; }
  function nameOf(idx) {
    if (mode === 'hotseat') return 'Player ' + (idx + 1);
    return idx === humanIdx ? 'You' : 'AI';
  }
  function viewerIdx() { return mode === 'hotseat' ? game.current : humanIdx; }

  function newGame() {
    mode = $('#mode').value;
    humanIdx = mode === 'ai-first' ? 1 : 0;
    game = E.newGame({});
    history = [];
    scoreSaved = false;
    resetTransient();
    render();
    maybeRunAI();
  }

  // ---------- leaderboard (shared Firebase DB, same approach as rose-lilly) ----------
  const FIREBASE_URL = 'https://rose-lilly-default-rtdb.firebaseio.com/splendor-duel';
  const NAME_KEY = 'splendor-duel-last-name';

  function getLastName() {
    try { return localStorage.getItem(NAME_KEY) || ''; } catch { return ''; }
  }
  function setLastName(name) {
    try { localStorage.setItem(NAME_KEY, name); } catch { /* unavailable */ }
  }

  async function loadLeaderboard() {
    try {
      const response = await fetch(`${FIREBASE_URL}.json`);
      if (!response.ok) throw new Error('fetch failed');
      const data = await response.json();
      if (!data) return [];
      return Object.values(data).sort((a, b) => a.rounds - b.rounds || b.points - a.points);
    } catch {
      return [];
    }
  }

  async function addLeaderboardEntry(entry) {
    setLastName(entry.name);
    try {
      const response = await fetch(`${FIREBASE_URL}.json`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(entry),
      });
      if (!response.ok) throw new Error('save failed');
    } catch {
      // Firebase unavailable — entry lost, but game continues
    }
  }

  async function renderLeaderboard() {
    const body = $('#lbbody');
    body.textContent = 'Loading…';
    const entries = await loadLeaderboard();
    if (entries.length === 0) {
      body.textContent = 'No wins yet. Be the first to beat the AI!';
      return;
    }
    const rows = entries.map((e, i) => `<tr>
      <td class="pos">${i + 1}</td>
      <td>${String(e.name).slice(0, 24).replace(/[<>&]/g, '')}</td>
      <td>${e.rounds} round${e.rounds === 1 ? '' : 's'}</td>
      <td>${String(e.reason || '').replace(/[<>&]/g, '')}</td>
      <td>${e.points}–${e.aiPoints}</td>
      <td class="pos">${e.date || ''}</td>
    </tr>`).join('');
    body.innerHTML = `<table class="lb-table">
      <tr><th>#</th><th>Name</th><th>Speed</th><th>Victory</th><th>Score</th><th>Date</th></tr>
      ${rows}
    </table>`;
  }

  async function saveScore() {
    const input = $('#pname');
    const name = (input && input.value.trim()) || 'Anonymous';
    if (scoreSaved || !game || game.winner === null) return;
    scoreSaved = true;
    const me = game.players[game.winner];
    const opp = game.players[1 - game.winner];
    await addLeaderboardEntry({
      name,
      date: new Date().toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' }),
      rounds: Math.ceil(game.turnCount / 2),
      reason: game.winReason,
      points: E.points(me),
      aiPoints: E.points(opp),
    });
    render();
    $('#lbdialog').showModal();
    renderLeaderboard();
  }

  function resetTransient() {
    sel = [];
    privMode = false;
    cardSel = null;
    goldFor = null;
  }

  // ---------- move animations ----------
  // Every visible change is derived by diffing the state before and after a
  // move, so chained effects (buy -> ability token -> royal card) animate too.
  // slow-fast-slow S-curve: the flight eases out of its source and settles into
  // its destination instead of stopping dead
  const ANIM = { fly: 500, flash: 220, stagger: 60, gap: 90, ease: 'cubic-bezier(.65,0,.35,1)' };
  let animating = false;

  function fxLayer() {
    let l = document.getElementById('fxlayer');
    if (!l) {
      l = document.createElement('div');
      l.id = 'fxlayer';
      document.body.appendChild(l);
    }
    return l;
  }

  // body carries a zoom factor; clones live inside it, so convert viewport
  // pixels from getBoundingClientRect() into the body's own coordinate space
  function zoomFactor() {
    return parseFloat(getComputedStyle(document.body).zoom) || 1;
  }

  function rectOf(el) {
    if (!el) return null;
    const r = el.getBoundingClientRect();
    const z = zoomFactor();
    return { left: r.left / z, top: r.top / z, width: r.width / z, height: r.height / z };
  }

  function geometry() {
    const g = { cell: {}, card: {}, deck: {}, pile: {}, privs: {}, bag: {}, royal: {}, band: {}, slot: {}, ownroyal: {}, node: {} };
    const grab = (attr, bucket, keepNode, innerSel) => {
      document.querySelectorAll(`[data-anim-${attr}]`).forEach((el) => {
        const key = el.dataset['anim' + attr[0].toUpperCase() + attr.slice(1)];
        // anchor on the topmost token/scroll of a stack, not on the whole column
        const inner = innerSel ? [...el.querySelectorAll(innerSel)].pop() : null;
        g[bucket][key] = rectOf(inner || el);
        if (keepNode) g.node[bucket + ':' + key] = el.cloneNode(true);
      });
    };
    grab('cell', 'cell');
    grab('card', 'card', true);
    grab('deck', 'deck', true);
    grab('pile', 'pile', false, '.coin:not(.empty)');
    grab('privs', 'privs', false, '.scroll');
    grab('bag', 'bag', false, '.bcoin:not(.empty)');
    grab('royal', 'royal', true);
    grab('band', 'band');
    grab('slot', 'slot');
    grab('ownroyal', 'ownroyal');
    const pool = document.getElementById('privpool');
    g.privPool = pool ? rectOf([...pool.querySelectorAll('.scroll')].pop() || pool) : null;
    return g;
  }

  function stateSnapshot(s) {
    const bag = {};
    E.TOKEN_TYPES.forEach((c) => (bag[c] = 0));
    s.bag.forEach((c) => bag[c]++);
    return {
      board: s.board.slice(),
      bag,
      pool: s.privilegesPool,
      players: s.players.map((p) => ({
        tokens: { ...p.tokens },
        cards: p.cards.map((c) => c.id),
        reserved: p.reserved.map((r) => r.id),
        privileges: p.privileges,
        royals: p.royals.slice(),
      })),
    };
  }

  function planFlights(before, after, gb, ga, actor) {
    const flights = [];
    const add = (from, to, opts) => { if (from && to) flights.push({ from, to, ...opts }); };

    // --- what changed on the board ---
    const emptied = [], filled = [];
    for (let i = 0; i < 25; i++) {
      if (before.board[i] && !after.board[i]) emptied.push({ i, color: before.board[i] });
      if (!before.board[i] && after.board[i]) filled.push({ i, color: after.board[i] });
    }
    const gain = [0, 1].map((p) => {
      const o = {};
      E.TOKEN_TYPES.forEach((c) => { const d = after.players[p].tokens[c] - before.players[p].tokens[c]; if (d > 0) o[c] = d; });
      return o;
    });
    const loss = [0, 1].map((p) => {
      const o = {};
      E.TOKEN_TYPES.forEach((c) => { const d = before.players[p].tokens[c] - after.players[p].tokens[c]; if (d > 0) o[c] = d; });
      return o;
    });
    const bagGain = {};
    E.TOKEN_TYPES.forEach((c) => { const d = after.bag[c] - before.bag[c]; if (d > 0) bagGain[c] = d; });

    // board -> player (take tokens, privilege, gold, card ability)
    for (const e of emptied) {
      const p = [actor, 1 - actor].find((pi) => (gain[pi][e.color] || 0) > 0);
      if (p === undefined) continue;
      gain[p][e.color]--;
      add(gb.cell[e.i], ga.pile[`${p}-${e.color}`], { kind: 'token', color: e.color, hide: `pile:${p}-${e.color}` });
    }
    // opponent -> player (steal ability)
    for (const c of E.TOKEN_TYPES) {
      for (const p of [0, 1]) {
        while ((gain[p][c] || 0) > 0 && (loss[1 - p][c] || 0) > 0) {
          gain[p][c]--; loss[1 - p][c]--;
          add(gb.pile[`${1 - p}-${c}`], ga.pile[`${p}-${c}`], { kind: 'token', color: c, hide: `pile:${p}-${c}` });
        }
      }
    }
    // player -> bag (payment, discarding down to 10)
    for (const c of E.TOKEN_TYPES) {
      for (const p of [0, 1]) {
        while ((loss[p][c] || 0) > 0 && (bagGain[c] || 0) > 0) {
          loss[p][c]--; bagGain[c]--;
          add(gb.pile[`${p}-${c}`], ga.bag[c], { kind: 'token', color: c, hide: `bag:${c}` });
        }
      }
    }
    // bag -> board (replenish)
    for (const f of filled) {
      add(gb.bag[f.color], ga.cell[f.i], { kind: 'token', color: f.color, hide: `cell:${f.i}` });
    }

    // --- cards ---
    for (const p of [0, 1]) {
      const had = new Set(before.players[p].cards);
      after.players[p].cards.forEach((id) => {
        if (had.has(id)) return;
        const wasReserved = before.players[p].reserved.indexOf(id);
        const from = gb.card[id] || (wasReserved >= 0 ? gb.slot[`${p}-${wasReserved}`] : null);
        add(from, ga.band[`${p}-${id}`], {
          kind: 'card', node: gb.card[id] ? g_node(gb, 'card', id) : null, hide: `band:${p}-${id}`,
        });
      });
      const hadRes = new Set(before.players[p].reserved);
      after.players[p].reserved.forEach((id, slot) => {
        if (hadRes.has(id)) return;
        const lvl = E.CARD_BY_ID[id].level;
        const fromPyramid = gb.card[id];
        add(fromPyramid || gb.deck[lvl], ga.slot[`${p}-${slot}`], {
          kind: 'card',
          node: fromPyramid ? g_node(gb, 'card', id) : g_node(gb, 'deck', lvl),
          hide: `slot:${p}-${slot}`,
        });
      });
    }

    // --- privileges ---
    const poolLost = Math.max(0, before.pool - after.pool);
    let fromPool = poolLost;
    for (const p of [0, 1]) {
      let got = after.players[p].privileges - before.players[p].privileges;
      const oppLost = Math.max(0, before.players[1 - p].privileges - after.players[1 - p].privileges);
      let fromOpp = oppLost;
      while (got > 0) {
        let src = null;
        if (fromPool > 0) { src = gb.privPool; fromPool--; }
        else if (fromOpp > 0) { src = gb.privs[String(1 - p)]; fromOpp--; }
        else src = gb.privPool;
        add(src, ga.privs[String(p)], { kind: 'scroll', hide: `privs:${p}` });
        got--;
      }
      // spending a privilege sends the scroll back to the pool
      const spent = before.players[p].privileges - after.players[p].privileges;
      if (spent > 0 && after.pool > before.pool) {
        for (let k = 0; k < spent; k++) add(gb.privs[String(p)], ga.privPool, { kind: 'scroll' });
      }
    }

    // --- royal cards ---
    for (const p of [0, 1]) {
      const had = new Set(before.players[p].royals);
      after.players[p].royals.forEach((rid) => {
        if (had.has(rid)) return;
        add(gb.royal[rid], ga.ownroyal[`${p}-${rid}`], {
          kind: 'card', node: g_node(gb, 'royal', rid), hide: `ownroyal:${p}-${rid}`,
        });
      });
    }
    return flights;
  }

  function g_node(geo, bucket, key) {
    const n = geo.node[bucket + ':' + key];
    return n ? n.cloneNode(true) : null;
  }

  function makeClone(f) {
    if (f.node) {
      const el = f.node;
      el.classList.remove('buyable', 'selected', 'selectable', 'short', 'fxflash');
      el.removeAttribute('data-action');
      el.style.margin = '0';
      return el;
    }
    const el = document.createElement('div');
    if (f.kind === 'scroll') el.className = 'scroll';
    else el.className = 'fxtok c-' + f.color;
    return el;
  }

  // the elements that will appear for a given destination key, newest last
  function arrivalElements(key, n) {
    const [type, id] = key.split(':');
    if (type === 'pile') {
      const el = document.querySelector(`[data-anim-pile="${id}"]`);
      return el ? [...el.querySelectorAll('.coin:not(.empty)')].slice(-n) : [];
    }
    if (type === 'bag') {
      const el = document.querySelector(`[data-anim-bag="${id}"]`);
      return el ? [...el.querySelectorAll('.bcoin:not(.empty)')].slice(-n) : [];
    }
    if (type === 'privs') {
      const el = document.querySelector(`[data-anim-privs="${id}"]`);
      return el ? [...el.querySelectorAll('.scroll')].slice(-n) : [];
    }
    const el = document.querySelector(`[data-anim-${type}="${id}"]`);
    return el ? [el] : [];
  }

  async function runFlights(flights) {
    if (!flights.length) return;
    const layer = fxLayer();

    // Each flight owns the exact element it turns into: that element is hidden,
    // gives the flight its true landing rect, and is revealed the instant the
    // clone stops on top of it — so nothing waits, blinks or resizes on arrival.
    const groups = {};
    flights.forEach((f) => { if (f.hide) (groups[f.hide] = groups[f.hide] || []).push(f); });
    Object.keys(groups).forEach((key) => {
      const list = groups[key];
      arrivalElements(key, list.length).forEach((el, i) => {
        if (!list[i]) return;
        list[i].arrival = el;
        const r = rectOf(el);
        if (r && r.width && r.height) list[i].to = r;
        el.style.visibility = 'hidden';
      });
    });

    const runs = flights.map((f, i) => new Promise((done) => {
      const el = makeClone(f);
      if (!el) {
        if (f.arrival) f.arrival.style.visibility = '';
        return done();
      }
      const place = (node, w, h) => {
        node.style.left = f.from.left + 'px';
        node.style.top = f.from.top + 'px';
        node.style.width = w + 'px';
        node.style.height = h + 'px';
        node.style.transformOrigin = '0 0';
      };
      const tx = f.to.left - f.from.left;
      const ty = f.to.top - f.from.top;
      const sx = f.to.width / (f.from.width || 1);
      const sy = f.to.height / (f.from.height || 1);
      const timing = { duration: ANIM.fly, delay: i * ANIM.stagger, easing: ANIM.ease, fill: 'forwards' };

      place(el, f.from.width, f.from.height);
      layer.appendChild(el);

      // a card and the thin band it becomes look nothing alike, so the two
      // cross-fade while moving; by touchdown the clone is a copy of the target
      let morph = null;
      if (f.arrival && f.kind === 'card') {
        morph = f.arrival.cloneNode(true);
        morph.style.visibility = 'visible';
        place(morph, f.to.width, f.to.height);
        morph.style.opacity = '0';
        layer.appendChild(morph);
        morph.animate([
          { transform: `scale(${1 / sx}, ${1 / sy})`, opacity: 0 },
          { opacity: 0, offset: 0.45 },
          { transform: `translate(${tx}px, ${ty}px) scale(1, 1)`, opacity: 1 },
        ], timing);
        el.animate([
          { opacity: 1 }, { opacity: 1, offset: 0.45 }, { opacity: 0 },
        ], timing);
      }

      const a = el.animate([
        { transform: 'translate(0,0) scale(1,1)' },
        { transform: `translate(${tx}px, ${ty}px) scale(${sx}, ${sy})` },
      ], timing);

      a.finished.catch(() => {}).then(() => {
        if (f.arrival) f.arrival.style.visibility = '';
        // keep the clone one frame longer: it covers the revealed element
        // exactly, so the handover never shows a gap
        requestAnimationFrame(() => {
          el.remove();
          if (morph) morph.remove();
          done();
        });
      });
    }));

    await Promise.all(runs);
  }

  function flashTargets(move) {
    const q = (sel) => document.querySelector(sel);
    const els = [];
    if (move.t === 'take') move.cells.forEach((i) => els.push(q(`[data-anim-cell="${i}"]`)));
    if (move.t === 'privilege' || move.t === 'tokenBoard') els.push(q(`[data-anim-cell="${move.cell}"]`));
    if (move.t === 'reserve') {
      els.push(q(`[data-anim-cell="${move.gold}"]`));
      els.push(move.slot === 'deck'
        ? q(`[data-anim-deck="${move.level}"]`)
        : q(`[data-anim-card="${game.pyramid[move.level][move.slot]}"]`));
    }
    if (move.t === 'buy') els.push(q(`[data-anim-card="${move.card}"]`));
    if (move.t === 'royal') els.push(q(`[data-anim-royal="${move.royal}"]`));
    if (move.t === 'steal') {
      const opp = 1 - game.current;
      els.push(q(`[data-anim-pile="${opp}-${move.color}"]`));
    }
    return els.filter(Boolean);
  }

  async function applyAnimated(move, opts) {
    opts = opts || {};
    const before = stateSnapshot(game);
    const gb = geometry();
    const actor = game.current;

    if (opts.flash) {
      const els = flashTargets(move);
      if (els.length) {
        els.forEach((el) => el.classList.add('fxflash'));
        await sleep(ANIM.flash);
        els.forEach((el) => el.classList.remove('fxflash'));
      }
    }

    game = E.applyMove(game, move);
    resetTransient();
    render();

    const flights = planFlights(before, stateSnapshot(game), gb, geometry(), actor);
    await runFlights(flights);
    return flights.length;
  }

  async function applyHuman(move) {
    if (busy || animating || game.winner !== null) return;
    let snapshot;
    try {
      snapshot = JSON.stringify(game);
      E.applyMove(game, move); // validate before touching history
    } catch (e) {
      console.error(e);
      flash(e.message);
      return;
    }
    history.push(snapshot);
    if (history.length > 400) history.shift();
    animating = true;
    try {
      await applyAnimated(move, { flash: false });
    } finally {
      animating = false;
    }
    render();
    maybeRunAI();
  }

  function undo() {
    if (busy || history.length === 0) return;
    game = JSON.parse(history.pop());
    resetTransient();
    render();
  }

  function sleep(ms) { return new Promise((r) => setTimeout(r, ms)); }

  async function maybeRunAI() {
    if (mode === 'hotseat') return;
    if (busy) return;
    busy = true;
    render();
    while (game.winner === null && !isHuman(game.current)) {
      await sleep(220);
      const mv = AI.chooseMove(game);
      if (!mv) break;
      const flown = await applyAnimated(mv, { flash: true });
      await sleep(flown ? ANIM.gap : 200);
    }
    busy = false;
    render();
  }

  function flash(msg) {
    const el = $('#actionbar .msg');
    if (el) el.textContent = msg;
  }

  // ---------- rendering ----------
  function tokTitle(t) { return t[0].toUpperCase() + t.slice(1); }

  // what the viewing player is missing to buy this card (null = affordable)
  function affordInfo(card) {
    if (!game) return null;
    const viewer = game.players[viewerIdx()];
    const b = E.bonuses(viewer);
    const lackByColor = {};
    let lackTotal = 0;
    for (const c of COST_ORDER) {
      const eff = Math.max(0, (card.cost[c] || 0) - (c === 'pearl' ? 0 : b[c]));
      const lack = Math.max(0, eff - viewer.tokens[c]);
      if (lack > 0) { lackByColor[c] = lack; lackTotal += lack; }
    }
    const gold = viewer.tokens.gold;
    if (lackTotal <= gold) return null; // gold covers the gap
    return { lackByColor, short: lackTotal - gold, gold, privileges: viewer.privileges };
  }

  function cardHTML(card, cls, attrs, jokerColor) {
    const info = affordInfo(card);
    const costChips = COST_ORDER
      .filter((c) => card.cost[c])
      .map((c) => {
        const lack = info && info.lackByColor[c];
        const state = lack ? 'lack' : 'have';
        const hint = lack ? ` — missing ${lack}` : '';
        return `<span class="cc c-${c} ${state}" ${lack ? `data-lack="-${lack}"` : ''} title="${card.cost[c]} ${c}${hint}">${card.cost[c]}</span>`;
      })
      .join('');
    let needHint = '';
    if (info && (info.gold || info.privileges)) {
      const parts = [];
      if (info.gold) parts.push(`<span class="dot c-gold"></span>${info.gold}`);
      if (info.privileges) parts.push(`<span class="scroll mini"></span>${info.privileges}`);
      needHint = `<div class="needhint" title="You have gold / privileges that can help close the gap">${parts.join('<span style="opacity:.5">·</span>')}</div>`;
    }
    const crowns = card.crowns ? `<span class="crowns">${'♛'.repeat(card.crowns)}</span>` : '';
    const pts = `<span class="pts${card.points ? '' : ' zero'}">${card.points}</span>`;
    const bonusColor = card.color === 'joker' && jokerColor ? jokerColor : card.color;
    const bonusTitle = card.color === 'joker'
      ? (jokerColor ? `Joker bonus assigned to ${jokerColor}` : 'Joker: copies one of your bonus colors')
      : card.color === 'none' ? 'No bonus (grey card)' : `Bonus: ${card.color}`;
    const markColor = card.color === 'joker' && !jokerColor ? 'joker' : bonusColor;
    const marks = card.color === 'none' ? '' :
      `<span class="bmarks" title="${bonusTitle}">${`<span class="bmark c-${markColor}"></span>`.repeat(card.bonus || 1)}</span>`;
    const ability = card.ability
      ? `<div class="ability" title="${ABILITY_TITLE[card.ability]}">${ABILITY_TEXT[card.ability]}</div>`
      : '<div class="ability"></div>';
    return `<div class="card ${cls || ''} ${info ? 'short' : ''}" ${attrs || ''} title="Level ${card.level} card ${card.id} — ${bonusTitle}" data-anim-card="${card.id}">
      <div class="band c-${bonusColor}">${pts}${crowns}${marks}</div>
      <div class="cardbody">
        ${ability}
        <div class="cost">${costChips}</div>
      </div>
      ${needHint}
    </div>`;
  }

  function renderPanel(idx) {
    const p = game.players[idx];
    const active = game.current === idx && game.winner === null;
    const b = E.bonuses(p);
    const cp = E.colorPoints(p);
    const pts = E.points(p);
    const cr = E.crowns(p);
    const viewer = viewerIdx();
    const discarding = active && isHuman(idx) && game.pending.length > 0 && game.pending[0].t === 'discard';

    // owned cards drawn as mini card-tops: points left, bonus dots right —
    // read each column like the real game, no precomputed sums
    const cardsByColor = { white: [], blue: [], green: [], red: [], black: [], none: [] };
    for (const pc of p.cards) {
      const card = E.CARD_BY_ID[pc.id];
      const color = card.color === 'joker' ? (pc.jokerColor || 'none') : card.color;
      (cardsByColor[color] || cardsByColor.none).push(card);
    }
    const mband = (card, color) => {
      const dots = card.bonus ? `<span class="mdots">${'<i></i>'.repeat(card.bonus)}</span>` : '';
      return `<span class="mband c-${color}" style="z-index:1" data-anim-band="${idx}-${card.id}" title="${card.id}: ${card.points} point(s)${card.bonus ? `, ${card.bonus} ${color} bonus` : ''}${card.crowns ? `, ${'♛'.repeat(card.crowns)}` : ''}">
        <span class="mpts">${card.points || ''}</span>${dots}</span>`;
    };
    // the column is a fixed 82px tall: past six cards the overlap tightens so
    // every card stays visible and the panel never changes size
    const STACK_H = 82, BAND_H = 17, STEP = 14;
    const cstack = (color) => {
      const list = cardsByColor[color];
      if (!list || list.length === 0) return '<div class="cstack"><span class="mband empty"></span></div>';
      const step = list.length > 1 ? Math.min(STEP, (STACK_H - BAND_H) / (list.length - 1)) : STEP;
      let bands = '';
      list.forEach((card, i) => {
        const overlap = i === 0 ? 0 : -(BAND_H - step);
        bands += mband(card, color).replace('z-index:1', `z-index:${i + 1};margin-bottom:${overlap.toFixed(1)}px`);
      });
      return `<div class="cstack">${bands}</div>`;
    };
    const pile = (n, c, clickable) => {
      const attrs = clickable ? `data-action="discard" data-color="${c}"` : '';
      const anchor = `data-anim-pile="${idx}-${c}"`;
      if (!n) return `<div class="pile" ${anchor} title="0 ${c} tokens"><span class="coin empty"></span></div>`;
      let coins = '';
      for (let i = 0; i < Math.min(n, 4); i++) {
        coins += `<span class="coin c-${c}" style="z-index:${i + 1}"></span>`;
      }
      return `<div class="pile ${clickable ? 'clickable' : ''}" ${attrs} ${anchor} title="${n} ${c} token(s)${clickable ? ' — click to discard one' : ''}">${coins}</div>`;
    };
    const cols = GEMS.map((c) => `
      <div>
        ${cstack(c)}
        ${pile(p.tokens[c], c, discarding && p.tokens[c] > 0)}
      </div>`).join('');
    const extraCols = ['pearl', 'gold'].map((c, i) => `
      <div>
        ${i === 0 && cardsByColor.none.length ? cstack('none') : '<div class="cstack"></div>'}
        ${pile(p.tokens[c], c, discarding && p.tokens[c] > 0)}
      </div>`).join('');

    const reserved = p.reserved.map((rc, slot) => {
      const card = E.CARD_BY_ID[rc.id];
      const visible = rc.known || idx === viewer;
      // face-down cards carry only their slot index, never the card id
      if (!visible) return `<div class="card mini back" data-anim-slot="${idx}-${slot}">?</div>`;
      const mine = active && isHuman(idx) && game.pending.length === 0 && !busy;
      const buyable = mine && E.canBuy(game, p, card);
      const selCls = cardSel && cardSel.kind === 'res' && cardSel.id === rc.id ? 'selected' : '';
      return cardHTML(card, `mini ${buyable ? 'buyable' : ''} selectable ${selCls}`,
        `data-action="rescard" data-id="${rc.id}" data-owner="${idx}" data-anim-slot="${idx}-${slot}"`);
    }).join('');

    const royalsOwned = p.royals.map((rid) => {
      const r = E.ROYAL_BY_ID[rid];
      return `<span class="rchip" data-anim-ownroyal="${idx}-${rid}" title="Royal card: ${r.points} prestige points${r.ability ? ', ' + ABILITY_TEXT[r.ability] : ''}">
        <b>${r.points}</b>${r.ability ? ABILITY_ICON[r.ability] : ''}</span>`;
    }).join('');

    return `<div class="panel ${active ? 'active' : ''}">
      <div class="head">
        <span class="name">${nameOf(idx)} <span style="color:var(--dim);font-weight:400">&middot; P${idx + 1}</span></span>
        ${royalsOwned}
        <span class="score">
          <span class="crn" title="crowns">♛ ${cr}</span>
          <span class="ptsnum" title="prestige points">${pts}</span>
        </span>
      </div>
      <div class="colorgrid">${cols}${extraCols}</div>
      <div class="reserved">${reserved}
        <span class="privs" data-anim-privs="${idx}" title="${p.privileges} privilege(s)">
          ${'<span class="scroll"></span>'.repeat(p.privileges)}
        </span>
      </div>
    </div>`;
  }

  function renderRoyals() {
    const humanTurn = isHuman(game.current) && !busy;
    const choosing = humanTurn && game.pending.length > 0 && game.pending[0].t === 'royal';
    const cards = E.ROYALS.map((r) => {
      const avail = game.royals.includes(r.id);
      const cls = !avail ? 'taken' : choosing ? 'selectable' : '';
      const attr = avail && choosing ? `data-action="royal" data-id="${r.id}"` : '';
      return `<div class="royal ${cls}" ${attr} data-anim-royal="${r.id}" title="Royal card: ${r.points} prestige points${r.ability ? ', ' + ABILITY_TEXT[r.ability] : ''}. Take one when you reach your 3rd and 6th crown.">
        <div class="pts">${r.points}</div>
        <div class="ability">${r.ability ? ABILITY_TEXT[r.ability] : ''}</div>
      </div>`;
    }).join('');
    const pool = '<span class="scroll pool"></span>'.repeat(game.privilegesPool);
    return `<div class="tablerow royalsrow">
      <span class="rlabel">Royals<br><span style="font-size:10px">at 3♛ &amp; 6♛</span></span>
      <div class="rcards">${cards}</div>
      <div class="privpool" id="privpool">Privileges ${pool || '<span style="opacity:.4">none</span>'}</div>
    </div>`;
  }

  function renderPyramid() {
    const me = game.players[game.current];
    const humanTurn = isHuman(game.current) && !busy && game.winner === null;
    const canAct = humanTurn && game.pending.length === 0 && !game.turn.mandatoryDone;
    const decks = [3, 2, 1].map((lv) => {
      const deckCnt = game.decks[lv].length;
      const deckSel = cardSel && cardSel.kind === 'deck' && cardSel.level === lv ? 'selected' : '';
      const deckClickable = canAct && deckCnt > 0 && me.reserved.length < 3 && game.board.includes('gold');
      return `<div class="deck ${deckClickable ? 'selectable' : ''} ${deckSel}" data-anim-deck="${lv}"
        ${deckClickable ? `data-action="deck" data-level="${lv}"` : ''}
        title="Level ${lv} deck: ${deckCnt} cards${deckClickable ? ' — click to reserve the top card' : ''}">
        <span class="lvl">${'●'.repeat(lv)}</span><span class="cnt">${deckCnt}</span><span class="cardslbl">cards</span>
      </div>`;
    }).join('');
    const rows = [3, 2, 1].map((lv) => {
      const slots = game.pyramid[lv].map((cid, slot) => {
        if (!cid) return `<div class="card" style="opacity:.15"></div>`;
        const card = E.CARD_BY_ID[cid];
        const buyable = canAct && E.canBuy(game, me, card);
        const selCls = cardSel && cardSel.kind === 'pyr' && cardSel.id === cid ? 'selected' : '';
        return cardHTML(card, `${buyable ? 'buyable' : ''} ${canAct ? 'selectable' : ''} ${selCls}`,
          `data-action="pyrcard" data-id="${cid}" data-level="${lv}" data-slot="${slot}"`);
      }).join('');
      return `<div class="pyr-row">${slots}</div>`;
    }).join('');
    return `<div class="decks">${decks}</div><div class="pyramid">${rows}</div>`;
  }

  function renderBoard() {
    const humanTurn = isHuman(game.current) && !busy && game.winner === null;
    const pd = game.pending[0];
    const tokenBoardCells = new Set();
    if (humanTurn && pd && pd.t === 'tokenBoard') {
      E.legalMoves(game).forEach((m) => tokenBoardCells.add(m.cell));
    }
    const canSelectTokens = humanTurn && !pd && !game.turn.mandatoryDone && !privMode && !goldFor;

    const cells = game.board.map((tok, i) => {
      if (!tok) return `<div class="cell" data-anim-cell="${i}"></div>`;
      let cls = 'cell filled c-' + tok;
      let attr = '';
      if (humanTurn) {
        if (goldFor && tok === 'gold') {
          cls += ' pick hint';
          attr = `data-action="gold" data-cell="${i}"`;
        } else if (privMode && tok !== 'gold') {
          cls += ' pick hint';
          attr = `data-action="priv-take" data-cell="${i}"`;
        } else if (tokenBoardCells.has(i)) {
          cls += ' pick hint';
          attr = `data-action="ability-token" data-cell="${i}"`;
        } else if (canSelectTokens && tok !== 'gold') {
          const would = sel.includes(i) || E.validateTakeCells(game, sel.concat([i])) === null;
          if (sel.includes(i)) cls += ' sel pick';
          else if (would && sel.length < 3) cls += ' pick';
          else cls += sel.length ? ' dimmed' : '';
          if (sel.includes(i) || (would && sel.length < 3)) attr = `data-action="cell" data-cell="${i}"`;
        }
      }
      const label = tok === 'gold' ? '★' : tok === 'pearl' ? 'P' : '';
      return `<div class="${cls}" ${attr} data-anim-cell="${i}" title="${tokTitle(tok)}">${label}</div>`;
    }).join('');
    return `<div id="board">${cells}</div>`;
  }

  // the bag: one stack per color, at most 4 tokens each, so no numbers needed
  function renderBag() {
    const counts = {};
    E.TOKEN_TYPES.forEach((c) => (counts[c] = 0));
    game.bag.forEach((c) => counts[c]++);
    const cols = E.TOKEN_TYPES.map((c) => {
      let coins = '';
      for (let i = 0; i < counts[c]; i++) coins += `<span class="bcoin c-${c}" style="z-index:${i + 1}"></span>`;
      if (!counts[c]) coins = '<span class="bcoin empty"></span>';
      return `<div class="bcol" data-anim-bag="${c}" title="${counts[c]} ${c} in the bag">${coins}</div>`;
    }).join('');
    return `<div class="bagwrap" title="Tokens in the bag: ${game.bag.length}">
      <span class="baglbl">Bag</span><div class="bagcols">${cols}</div>
    </div>`;
  }

  // prompts about clicking the board itself live right under the board
  function renderBoardActions() {
    const parts = [];
    const humanTurn = isHuman(game.current) && !busy && game.winner === null;
    const pd = game.pending[0];
    if (humanTurn) {
      if (pd && pd.t === 'tokenBoard') {
        parts.push(`<span class="msg">Card ability: click a ${pd.color} token</span>`);
      } else if (goldFor) {
        parts.push('<span class="msg">Click a gold token</span>');
        parts.push('<button data-action="cancel">Cancel</button>');
      } else if (privMode) {
        parts.push('<span class="msg">Click any non-gold token</span>');
        parts.push('<button data-action="cancel">Cancel</button>');
      } else if (!pd && !cardSel && !game.turn.mandatoryDone && sel.length > 0) {
        const valid = E.validateTakeCells(game, sel) === null;
        const same3 = valid && sel.length === 3 && sel.every((i) => game.board[i] === game.board[sel[0]]);
        const pearls2 = valid && sel.filter((i) => game.board[i] === 'pearl').length >= 2;
        const warn = same3 || pearls2 ? ` (opponent gains ${SCROLL_HTML})` : '';
        const picked = {};
        sel.forEach((i) => { const c = game.board[i]; picked[c] = (picked[c] || 0) + 1; });
        const chips = Object.keys(picked).map((c) => chipsHTML(c, picked[c])).join('');
        parts.push(`<button class="primary" data-action="do-take" ${valid ? '' : 'disabled'}>Take ${chips}${warn}</button>`);
        parts.push('<button data-action="cancel">Clear</button>');
      }
    }
    return `<div id="boardactions">${parts.join('')}</div>`;
  }

  function renderActionBar() {
    const parts = [];
    const humanTurn = isHuman(game.current) && !busy && game.winner === null;
    const moves = game.winner === null ? E.legalMoves(game) : [];
    const pd = game.pending[0];

    if (game.winner !== null) {
      parts.push(`<span class="msg">${nameOf(game.winner)} won: ${game.winReason}</span>`);
    } else if (busy) {
      parts.push('<span class="msg info">AI is thinking…</span>');
    } else if (!humanTurn) {
      parts.push('<span class="msg info">Waiting…</span>');
    } else if (pd) {
      if (pd.t === 'discard') {
        const cnt = E.tokenCount(game.players[game.current]);
        parts.push(`<span class="msg">Too many tokens (${cnt}/10) — click your tokens to discard</span>`);
      } else if (pd.t === 'royal') {
        parts.push('<span class="msg">Choose a Royal card</span>');
      } else if (pd.t === 'steal') {
        parts.push('<span class="msg">Steal a token from your opponent:</span>');
        moves.forEach((m) => {
          parts.push(`<span class="colorbtn c-${m.color}" data-action="steal" data-color="${m.color}" title="steal ${m.color}"></span>`);
        });
      } else if (pd.t === 'joker') {
        parts.push('<span class="msg">Choose a color for your joker card:</span>');
        moves.forEach((m) => {
          parts.push(`<span class="colorbtn c-${m.color}" data-action="joker" data-color="${m.color}" title="${m.color}"></span>`);
        });
      } else if (pd.t === 'tokenBoard') {
        parts.push(`<span class="msg">Card ability: pick a ${pd.color} token on the board</span>`);
      }
    } else if (goldFor || privMode) {
      // board prompt is shown under the board; keep this strip quiet
    } else if (cardSel) {
      const me = game.players[game.current];
      if (cardSel.kind === 'deck') {
        parts.push(`<span class="msg info">Level ${cardSel.level} deck</span>`);
        parts.push(`<button class="primary" data-action="do-reserve">Reserve top card + take gold</button>`);
      } else {
        const card = E.CARD_BY_ID[cardSel.id];
        const pay = E.paymentFor(game, me, card);
        if (cardSel.kind === 'pyr') {
          if (E.canBuy(game, me, card)) {
            parts.push(`<button class="primary" data-action="do-buy">Buy ${payChips(pay)}</button>`);
          } else {
            parts.push(`<span class="msg info">${whyNot(me, card)}</span>`);
          }
          if (me.reserved.length < 3 && game.board.includes('gold')) {
            parts.push(`<button data-action="do-reserve">Reserve + take gold</button>`);
          }
        } else if (cardSel.kind === 'res') {
          if (E.canBuy(game, me, card)) {
            parts.push(`<button class="primary" data-action="do-buy">Buy ${payChips(pay)}</button>`);
          } else {
            parts.push(`<span class="msg info">${whyNot(me, card)}</span>`);
          }
        }
      }
      parts.push('<button data-action="cancel">Cancel</button>');
    } else {
      if (!game.turn.mandatoryDone) {
        if (sel.length === 0) {
          parts.push('<span class="msg info">Click board tokens (line of up to 3), a card, or a deck.</span>');
        }
        if (moves.some((m) => m.t === 'privilege')) {
          parts.push(`<button data-action="use-priv" ${privMode ? 'class="primary"' : ''} title="Spend a privilege to take any non-gold token">${privMode ? 'Pick a token…' : `Spend ${SCROLL_HTML}`}</button>`);
        }
        if (moves.some((m) => m.t === 'replenish')) {
          parts.push(`<button data-action="replenish" title="Refill the board from the bag; your opponent gains a privilege">Replenish board</button>`);
        }
        if (moves.some((m) => m.t === 'pass')) {
          parts.push('<button data-action="pass">Pass (no action available)</button>');
        }
      }
    }
    return `<div id="actionbar">${parts.join('')}</div>`;
  }

  function payText(pay) {
    if (!pay || Object.keys(pay).length === 0) return 'free';
    return Object.keys(pay).map((c) => `${pay[c]} ${c}`).join(', ');
  }

  // payment drawn as the actual tokens it costs
  function payChips(pay) {
    if (!pay || Object.keys(pay).length === 0) return 'free';
    return Object.keys(pay).map((c) => chipsHTML(c, pay[c])).join('');
  }

  function whyNot(player, card) {
    if (card.color === 'joker') {
      const b = E.bonuses(player);
      if (!GEMS.some((c) => b[c] > 0)) return 'Joker cards require at least one bonus card';
    }
    const b = E.bonuses(player);
    const missing = [];
    let short = 0;
    for (const c of COST_ORDER) {
      const eff = Math.max(0, (card.cost[c] || 0) - (c === 'pearl' ? 0 : b[c]));
      const lack = Math.max(0, eff - player.tokens[c]);
      if (lack > 0) { missing.push(chipsHTML(c, lack)); short += lack; }
    }
    const gold = player.tokens.gold;
    if (short <= gold) return 'Affordable';
    return `Missing ${missing.join('')}${gold ? ` (you have ${chipsHTML('gold', gold)})` : ''}`;
  }

  function renderLog() {
    // newest moves first; older ones fade and shrink
    const items = game.log.slice(-200).reverse();
    return items.map((e, i) => {
      const cls = (e.player === null ? '' : 'p' + e.player) + (i >= 6 ? ' old' : '');
      return `<div class="entry ${cls}"><b>T${e.turn}</b> ${infographic(e.text)}</div>`;
    }).join('');
  }

  function render() {
    // top panel: opponent; bottom: you (in hotseat P2 top, P1 bottom)
    const topIdx = mode === 'hotseat' ? 1 : 1 - humanIdx;
    const botIdx = 1 - topIdx;
    $('#side').innerHTML = renderPanel(topIdx) + renderPanel(botIdx);
    $('#mid').innerHTML = renderRoyals() +
      `<div class="tablerow gametable">${renderPyramid()}
        <div class="boardwrap">
          <div class="boardstack">${renderBoard()}${renderBag()}</div>
          ${renderBoardActions()}
        </div>
      </div>`;
    $('#belowbar').innerHTML = renderActionBar();
    $('#logbox').innerHTML = renderLog();
    $('#undo').disabled = busy || history.length === 0;

    const ov = $('#overlay');
    if (game.winner !== null && !ov.dataset.dismissed) {
      ov.classList.remove('hidden');
      $('#overlay h2').textContent = `${nameOf(game.winner)} win${nameOf(game.winner) === 'You' ? '' : 's'}!`;
      const rounds = Math.ceil(game.turnCount / 2);
      $('#overlay p').textContent = `${game.winReason} — in ${rounds} round${rounds === 1 ? '' : 's'}`;
      const sa = $('#savearea');
      if (mode !== 'hotseat' && game.winner === humanIdx) {
        sa.innerHTML = scoreSaved
          ? '<span class="saved">Result saved ✓</span>'
          : `<input id="pname" maxlength="24" placeholder="Your name" value="${getLastName().replace(/"/g, '')}">
             <button class="primary" data-action="save-score">Save to leaderboard</button>`;
      } else {
        sa.innerHTML = '';
      }
    } else {
      ov.classList.add('hidden');
    }
  }

  // ---------- events ----------
  document.addEventListener('click', (ev) => {
    const el = ev.target.closest('[data-action]');
    if (!el) return;
    const a = el.dataset.action;

    if (a === 'leaderboard') { $('#lbdialog').showModal(); renderLeaderboard(); return; }
    if (a === 'lb-close') { $('#lbdialog').close(); return; }
    if (a === 'save-score') { saveScore(); return; }
    if (animating) return;
    if (a === 'new') { delete $('#overlay').dataset.dismissed; newGame(); return; }
    if (a === 'undo') { undo(); return; }
    if (a === 'overlay-close') { $('#overlay').dataset.dismissed = '1'; render(); return; }
    if (busy || !game || game.winner !== null) return;
    if (!isHuman(game.current)) return;

    switch (a) {
      case 'cell': {
        const i = +el.dataset.cell;
        if (sel.includes(i)) sel = sel.filter((x) => x !== i);
        else if (sel.length < 3) sel.push(i);
        cardSel = null;
        render();
        break;
      }
      case 'do-take':
        applyHuman({ t: 'take', cells: sel.slice() });
        break;
      case 'cancel':
        resetTransient();
        render();
        break;
      case 'replenish':
        applyHuman({ t: 'replenish' });
        break;
      case 'pass':
        applyHuman({ t: 'pass' });
        break;
      case 'use-priv':
        privMode = !privMode;
        sel = []; cardSel = null; goldFor = null;
        render();
        break;
      case 'priv-take':
        applyHuman({ t: 'privilege', cell: +el.dataset.cell });
        break;
      case 'pyrcard': {
        const id = el.dataset.id;
        if (cardSel && cardSel.kind === 'pyr' && cardSel.id === id) { cardSel = null; }
        else cardSel = { kind: 'pyr', id, level: +el.dataset.level, slot: +el.dataset.slot };
        sel = []; privMode = false; goldFor = null;
        render();
        break;
      }
      case 'deck': {
        const lv = +el.dataset.level;
        if (cardSel && cardSel.kind === 'deck' && cardSel.level === lv) cardSel = null;
        else cardSel = { kind: 'deck', level: lv };
        sel = []; privMode = false; goldFor = null;
        render();
        break;
      }
      case 'rescard': {
        const owner = +el.dataset.owner;
        if (owner !== game.current) return;
        const id = el.dataset.id;
        if (cardSel && cardSel.kind === 'res' && cardSel.id === id) cardSel = null;
        else cardSel = { kind: 'res', id };
        sel = []; privMode = false; goldFor = null;
        render();
        break;
      }
      case 'do-buy': {
        if (!cardSel) return;
        applyHuman({ t: 'buy', card: cardSel.id, from: cardSel.kind === 'res' ? 'reserve' : 'pyramid' });
        break;
      }
      case 'do-reserve': {
        if (!cardSel) return;
        const golds = [];
        game.board.forEach((t, i) => { if (t === 'gold') golds.push(i); });
        if (golds.length === 0) return;
        const target = cardSel.kind === 'deck'
          ? { level: cardSel.level, slot: 'deck' }
          : { level: cardSel.level, slot: cardSel.slot };
        if (golds.length === 1) {
          applyHuman({ t: 'reserve', gold: golds[0], ...target });
        } else {
          goldFor = target;
          render();
        }
        break;
      }
      case 'gold': {
        if (!goldFor) return;
        applyHuman({ t: 'reserve', gold: +el.dataset.cell, ...goldFor });
        break;
      }
      case 'discard':
        applyHuman({ t: 'discard', color: el.dataset.color });
        break;
      case 'royal':
        applyHuman({ t: 'royal', royal: el.dataset.id });
        break;
      case 'steal':
        applyHuman({ t: 'steal', color: el.dataset.color });
        break;
      case 'joker':
        applyHuman({ t: 'joker', color: el.dataset.color });
        break;
      case 'ability-token':
        applyHuman({ t: 'tokenBoard', cell: +el.dataset.cell });
        break;
    }
  });

  document.addEventListener('keydown', (ev) => {
    if (ev.key === 'Escape') { resetTransient(); render(); }
  });

  window.addEventListener('DOMContentLoaded', () => {
    newGame();
  });

  // debugging aid (used by automated tests; harmless in normal play)
  window.__sd = {
    get game() { return game; },
    set game(v) { game = v; resetTransient(); render(); },
    get busy() { return busy; },
    get animating() { return animating; },
    anim: ANIM,
  };
})();

</script>
</body>
</html>
